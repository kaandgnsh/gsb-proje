[project]
name = "local-assessment-ai"
version = "0.1.0"
description = "Yerel, çevrimdışı kişilik envanteri değerlendirme platformu"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/setup", "tests/runtime", "tests/support", "tests/store"]
addopts = "-m 'not integration' -p lai_test_categories"
markers = ["slow: creates real virtualenvs", "integration: real ollama binary and a real model"]
