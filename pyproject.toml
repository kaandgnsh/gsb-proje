[project]
name = "local-assessment-ai"
version = "0.1.0"
description = "Yerel, çevrimdışı kişilik envanteri değerlendirme platformu"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lai.reports" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/setup", "tests/runtime", "tests/support", "tests/store"]
addopts = "-m 'not integration' -p lai_test_categories -p ingest_helpers -p model_guard_plugin"
markers = ["slow: creates real virtualenvs", "integration: real ollama binary and a real model", "real_guard: uses the real model isolation guard (no test patch)"]
